name: 논문 수집기 (하루 1회)

on:
  schedule:
    - cron: '0 18 * * *'   # 매일 UTC 18:00(한국시간 새벽 3시). 필요에 맞게 바꾸세요.
  workflow_dispatch: {}     # Actions 탭에서 수동 실행도 가능

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      # 1) 수집: arXiv·OpenAlex·OSF(키 불필요) + CORE(CORE_API_KEY 시크릿이 있으면)
      - name: Collect
        run: node collector/collect.mjs --out ../papers.json --limit 5
        env:
          CORE_API_KEY: ${{ secrets.CORE_API_KEY }}

      # 2) AI 변환: ANTHROPIC_API_KEY 시크릿이 없으면 조용히 건너뛴다(앱은 그래도 안 깨짐)
      - name: Transform (AI 요약·퀴즈)
        run: node collector/transform-batch.mjs ../papers.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # 3) 바뀐 papers.json만 커밋 — 변화가 없으면 커밋하지 않는다
      - name: Commit papers.json
        run: |
          git config user.name "paperbite-bot"
          git config user.email "actions@users.noreply.github.com"
          git add papers.json
          git diff --cached --quiet || git commit -m "chore: 논문 수집기 자동 갱신"
          git push
