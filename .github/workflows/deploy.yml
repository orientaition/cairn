name: 배포 (GitHub Pages)

# 저장소가 공개로 바뀌어서 다시 자동 배포로 — main에 푸시될 때마다 dist/를 새로 만들어 올린다.
# Actions 탭에서 수동으로("Run workflow") 돌리는 것도 그대로 가능하다.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node deploy/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
