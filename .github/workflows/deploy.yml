name: 배포 (GitHub Pages)

# 수동 실행 전용 — GitHub Pages는 비공개 저장소의 무료 플랜에선 켤 수 없어서,
# 레포를 공개로 바꾸거나 Pro로 올리기 전까지는 push마다 자동으로 돌리면 계속 실패만 한다.
# 준비되면 Actions 탭에서 이 워크플로를 "Run workflow"로 수동 실행하면 된다.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node deploy/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
