<!DOCTYPE html>
<html lang="ko" data-theme="light" data-fs="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>논문 한 입 – 매일 조금씩 논문 읽기</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#2B4A7A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAF7; --surface:#FFFFFF; --text:#1F2328; --muted:#5B6470; --line:#D9D6CF;
  --accent:#2B4A7A; --accent-ink:#FFFFFF; --accent-weak:#EDF1F7;
  --ok:#2F6B4F; --bad:#9B3B3B; --warn:#8A6D1F;
  --r:7px; --fs:20px;
  --sans:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --serif:'Noto Serif KR','Noto Sans KR',Georgia,serif;
}
html[data-theme="dark"]{
  --bg:#15171A; --surface:#1C1F23; --text:#E8EAED; --muted:#A8AFB9; --line:#333941;
  --accent:#9CC0F0; --accent-ink:#15171A; --accent-weak:#222B38;
  --ok:#86CBA2; --bad:#E39B9B; --warn:#D7BE78;
}
html[data-fs="0"]{--fs:17px}
html[data-fs="1"]{--fs:20px}
html[data-fs="2"]{--fs:24px}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh}
.app{max-width:480px;margin:0 auto;padding:12px 16px 48px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a{color:var(--accent)}
hr.sep{border:0;border-top:1px solid var(--line);margin:22px 0 14px}

/* top */
.top{border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:14px}
.toprow{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand{font-family:var(--serif);font-weight:600;font-size:18px;letter-spacing:-.01em;background:none;border:0;padding:2px 0}
.topacts{display:flex;gap:4px}
.record{margin-top:4px;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.gain{color:var(--accent);font-weight:700;opacity:0;transition:opacity .15s linear}
.gain.on{opacity:1}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.flat{background:transparent}
.h2{font-family:var(--serif);font-size:19px;line-height:1.45;font-weight:600;margin:6px 0 4px;word-break:keep-all;overflow-wrap:anywhere}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.badge{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:1px 7px;font-size:12px;color:var(--muted);background:transparent}
.badge.lic-open{color:var(--ok);border-color:var(--ok)}
.badge.lic-limited{color:var(--warn);border-color:var(--warn)}
.badge.lic-unknown{color:var(--muted)}
.cite{font-size:13px;color:var(--muted);word-break:keep-all}

.btn{display:block;width:100%;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-weight:500;font-size:16px;text-align:center;background:var(--surface);transition:background-color .15s linear,color .15s linear}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;padding:15px 14px}
.btn.quiet{background:transparent;border-color:transparent;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.btn.sm{display:inline-block;width:auto;padding:7px 12px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.stack>*+*{margin-top:8px}
.linkrow{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:13px}
.linkrow button,.linkrow a{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:13px}

/* chips + options */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:transparent;border:1px solid var(--line);border-radius:4px;padding:5px 10px;font-size:14px;color:var(--text);transition:background-color .15s linear}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.s{font-size:13px;padding:4px 8px}
.chip .n{color:inherit;opacity:.7;margin-left:4px;font-size:12px}
.fieldset{border:0;padding:0;margin:0 0 12px}
.fieldset legend{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;padding:0;margin-bottom:6px}
details.scope{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px 12px;margin-bottom:12px}
details.scope>summary{cursor:pointer;font-size:14px;list-style:none}
details.scope>summary::-webkit-details-marker{display:none}
details.scope>summary::before{content:'▸ ';color:var(--muted)}
details.scope[open]>summary::before{content:'▾ '}
details.scope>summary .sum{color:var(--muted)}
.scopebody{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}

/* week record */
table.week{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
table.week th{font-weight:400;color:var(--muted);padding:2px 0;border-bottom:1px solid var(--line)}
table.week td{text-align:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
table.week td.on{color:var(--accent);font-weight:700}
table.week th.today{color:var(--text);font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* missions */
.mission{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.mission:first-of-type{border-top:0}
.mission .nm::before{content:'· ';color:var(--muted)}
.mission.done .nm::before{content:'✓ ';color:var(--ok)}
.mission.done .nm{color:var(--muted)}
.pt{color:var(--muted);font-size:13px}

/* read */
.pips{display:flex;gap:4px;margin:2px 0 14px}
.pip{flex:1;height:11px;border-radius:2px;border:1px solid var(--line);background:transparent}
.pip.done{background:var(--accent);border-color:var(--accent)}
.pip.cur{border-color:var(--accent)}
.sent{font-family:var(--serif);font-size:var(--fs);line-height:1.8;font-weight:400;word-break:keep-all;overflow-wrap:anywhere;max-width:36em}
.sent.en{font-family:var(--serif);word-break:normal;font-size:calc(var(--fs) * .9)}
.sent .term{font:inherit;font-weight:600;background:none;border:0;padding:0;color:inherit;border-bottom:1px dotted var(--accent);cursor:pointer}
.gloss{margin-top:12px;border-left:2px solid var(--accent);padding:6px 10px;font-size:14px;color:var(--muted);background:var(--accent-weak)}
.orig{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-family:var(--serif);font-size:calc(var(--fs) * .85);line-height:1.7;color:var(--muted)}
.timer{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:10px}
.timer .track{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.timer .track i{display:block;height:100%;background:var(--accent);transition:width .1s linear}
.timer.off .track i{background:var(--line)}

/* quiz */
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-top:8px;font-size:16px;transition:border-color .15s linear,background-color .15s linear}
.opt .n{flex:0 0 22px;height:22px;border:1px solid var(--line);border-radius:3px;display:grid;place-items:center;font-size:12px;color:var(--muted)}
.opt.correct{border-color:var(--ok);background:var(--accent-weak)}
.opt.correct .n{border-color:var(--ok);color:var(--ok)}
.opt.wrong{border-color:var(--bad);color:var(--muted)}
.opt[disabled]{cursor:default}
.ctx{font-family:var(--serif);font-size:16px;line-height:1.7;margin:8px 0;padding:10px;border-left:2px solid var(--line);word-break:normal}
.why{margin-top:12px;padding:10px;border-left:2px solid var(--accent);background:var(--accent-weak);font-size:14px}
.why.err{border-color:var(--bad);background:transparent;padding-left:10px}
textarea{width:100%;min-height:110px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--text);padding:10px;font-family:var(--serif);font-size:16px;line-height:1.7;resize:vertical}
textarea:focus-visible{outline:2px solid var(--accent);outline-offset:0}
input[type="search"]{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--text);font:inherit;font-size:15px;margin-bottom:10px}
input[type="time"]{font:inherit;font-size:15px;padding:6px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--text)}
input:focus-visible{outline:2px solid var(--accent);outline-offset:0}

/* result */
.num{font-family:var(--serif);font-size:32px;font-weight:600;line-height:1.2}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--accent)}
.center{text-align:center}

/* toast */
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--surface);color:var(--text);border:1px solid var(--line);padding:9px 14px;border-radius:var(--r);font-size:14px;z-index:70;max-width:92vw;text-align:center}
details.about{margin-top:8px}
details.about>summary{cursor:pointer;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top"></header>
  <main id="view"></main>
</div>
<div class="sr" id="live" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* =====================================================================
   PURE helpers (node에서 그대로 꺼내 단위 테스트함 — test.mjs 참고)
   ===================================================================== */
/*PURE_START*/
function hash(str){ let h=2166136261>>>0; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619)>>>0; } return h>>>0; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shuffle(arr,rng){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

const ABBR=['e.g.','i.e.','et al.','vs.','Fig.','Figs.','Eq.','No.','Dr.','cf.','approx.','U.S.','Inc.','etc.'];
function splitSentences(text){
  let t=String(text||'').replace(/\s+/g,' ').trim();
  if(!t) return [];
  ABBR.forEach(a=>{ t=t.split(a).join(a.replace(/\./g,'')); });
  const out=[]; let start=0; const re=/[.!?]["”')\]]*\s+/g; let m;
  while((m=re.exec(t))){
    const end=m.index+m[0].length, next=t[end];
    if(next && /[A-Z0-9가-힣“"'(\[]/.test(next)){ out.push(t.slice(start,end).trim()); start=end; }
  }
  out.push(t.slice(start).trim());
  const merged=[];
  for(const s of out){
    if(!s) continue;
    const min=/[가-힣]/.test(s)?10:25; // 한글은 글자 수가 적어서 기준을 낮춤
    if(merged.length && s.length<min) merged[merged.length-1]+=' '+s; else merged.push(s);
  }
  return merged.map(s=>s.replace(//g,'.'));
}

const STOP=new Set(('about above after again against all also although among and any are because been before being below between both but can could did does doing down during each either even every for from further had has have having here how however into its itself just more most much must neither nor not only other our out over own same should since some such than that the their them then there these they this those through thus too under until upon very was were what when where which while who whom why will with within without would your across often their towards toward using used based achieve achieves provide provides present presents propose proposes paper study results show shows').split(' '));
const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function matchCase(w,ref){
  if(/^[A-Z]{2,}$/.test(ref)) return w.toUpperCase();
  if(/^[A-Z]/.test(ref)) return w.charAt(0).toUpperCase()+w.slice(1);
  return w.charAt(0).toLowerCase()+w.slice(1);
}
function makeCloze(sents,seed=1,maxQ=3){
  const rng=mulberry32(seed);
  const pool=[...new Set(sents.join(' ').match(/[A-Za-z][A-Za-z-]{4,}/g)||[])].filter(w=>!STOP.has(w.toLowerCase()));
  const order=sents.map((s,i)=>({s,i})).filter(o=>o.s.length>=40).sort((a,b)=>b.s.length-a.s.length);
  const picked=[];
  for(const o of order){
    if(picked.length>=maxQ) break;
    const cands=(o.s.match(/[A-Za-z][A-Za-z-]{5,}/g)||[]).filter(w=>!STOP.has(w.toLowerCase())&&w.length<=16);
    if(!cands.length) continue;
    let best=null,bs=-1;
    for(const w of cands){
      const pos=o.s.indexOf(w);
      const sc=w.length+(pos>0&&/^[A-Z]/.test(w)?4:0)+(/[A-Z]{2,}/.test(w)?3:0);
      if(sc>bs){bs=sc;best=w;}
    }
    const lb=best.toLowerCase(), low=o.s.toLowerCase();
    const dis=pool.filter(w=>{const l=w.toLowerCase();return l!==lb&&Math.abs(w.length-best.length)<=3&&l.slice(0,4)!==lb.slice(0,4)&&!low.includes(l);});
    if(dis.length<2) continue;
    shuffle(dis,rng);
    const opts=[best,matchCase(dis[0],best),matchCase(dis[1],best)];
    const idx=shuffle([0,1,2],rng);
    const blanked=o.s.replace(new RegExp('\\b'+escRe(best)+'\\b','gi'),'_____');
    picked.push({type:'mc',i:o.i,q:'빈칸에 들어갈 말은?',ctx:blanked,options:idx.map(k=>opts[k]),answer:idx.indexOf(0),why:'정답: '+best,orig:o.s});
  }
  return picked.sort((a,b)=>a.i-b.i);
}

const LV_XP=150;
function levelInfo(xp){ const lv=Math.floor(xp/LV_XP)+1; return {lv,cur:xp%LV_XP,need:LV_XP}; }

/* 읽기 길이에 따른 규칙 — 5문장일 때 기존 값(완료 +20, 60초)을 그대로 유지 */
const LENS=[1,3,5,10];
function lenBonus(len){ return Math.max(5,len*4); }
function timeLimit(len){ return len*12; }

/* 용어 표시: 문장을 [{s}, {s,term:true,def}] 조각으로 쪼갠다. 용어당 첫 등장만. */
function markTerms(text,terms){
  let segs=[{s:String(text==null?'':text)}];
  for(const t of (terms||[])){
    if(!t||!t.t) continue;
    for(let i=0;i<segs.length;i++){
      if(segs[i].term) continue;
      const k=segs[i].s.indexOf(t.t);
      if(k<0) continue;
      const s=segs[i].s, rep=[];
      if(k>0) rep.push({s:s.slice(0,k)});
      rep.push({s:t.t,term:true,def:t.d||''});
      if(k+t.t.length<s.length) rep.push({s:s.slice(k+t.t.length)});
      segs.splice(i,1,...rep);
      break;
    }
  }
  return segs.filter(x=>x.s!=='');
}

function citation(p){
  return [p.authors||'저자 미확인',p.date?'('+p.date+').':'(연도 미확인).',p.title+'.',p.source?p.source+'.':null,p.url||null].filter(Boolean).join(' ');
}

/* 복습 큐: 3단계 Leitner(1일/3일/7일). 날짜는 YYYY-MM-DD 문자열, UTC 기준 날짜 산술이라
   자정 전후 몇 시간의 오차는 있을 수 있지만 하루 단위 앱에서는 문제되지 않는다. */
const BOX_DAYS={1:1,2:3,3:7};
function addDaysUTC(key,n){
  const [y,m,d]=key.split('-').map(Number);
  const dt=new Date(Date.UTC(y,m-1,d)+n*86400000);
  return dt.getUTCFullYear()+'-'+String(dt.getUTCMonth()+1).padStart(2,'0')+'-'+String(dt.getUTCDate()).padStart(2,'0');
}
function reviewAdvance(entry,correct,today){
  if(!correct) return Object.assign({},entry,{box:1,due:addDaysUTC(today,1)});
  const box=entry.box+1;
  if(box>3) return null; // 3단계를 모두 통과하면 큐에서 졸업(제거)
  return Object.assign({},entry,{box,due:addDaysUTC(today,BOX_DAYS[box])});
}

/* 난이도 폴백: 요청한 난이도의 자료가 없거나 라이선스가 맞지 않으면 한국어 요약으로 되돌아간다. */
function resolveDifficulty(paper,requested){
  if(requested==='en') return (paper.en&&paper.en.length)?'en':'ko';
  if(requested==='intro'){
    const licOk=paper.lic==='ccby'||paper.lic==='cc0';
    return (licOk&&paper.intro&&paper.intro.length)?'intro':'ko';
  }
  return 'ko';
}
function readingSource(paper,requested){
  const eff=resolveDifficulty(paper,requested);
  if(eff==='en') return {sents:paper.en,lang:'en',effective:eff};
  if(eff==='intro') return {sents:paper.intro,lang:'en',effective:eff};
  return {sents:paper.sents,lang:'ko',effective:eff};
}

/* 실시간 웹 검색 결과 다듬기: OpenAlex의 초록은 단어→위치 역색인으로 와서 문장으로 복원해야 한다.
   길이도 한 줄 요약처럼 자르되, 단어 중간을 끊지 않는다. */
function reconstructAbstract(invIndex){
  if(!invIndex) return '';
  const words=[];
  for(const [w,positions] of Object.entries(invIndex)) for(const p of positions) words[p]=w;
  return words.join(' ').replace(/\s+/g,' ').trim();
}
function truncateText(s,max){
  s=String(s||'');
  if(s.length<=max) return s;
  return s.slice(0,max).replace(/\s+\S*$/,'')+'…';
}

/* 노트 내보내기: 논문별로 묶은 Markdown 문자열 */
function notesMarkdown(notes){
  const order=[], groups=new Map();
  for(const n of notes){
    const key=n.id||n.title;
    if(!groups.has(key)){ groups.set(key,{title:n.title,items:[]}); order.push(key); }
    groups.get(key).items.push(n);
  }
  let md='# 내 노트\n\n';
  for(const key of order){
    const g=groups.get(key);
    md+='## '+g.title+'\n\n';
    for(const n of g.items) md+='- '+n.date+' — '+n.text+'\n';
    md+='\n';
  }
  return md.trim()+'\n';
}

/* 접근성: WCAG 상대 휘도 기반 명암비. 4.5 이상이면 일반 텍스트 AA를 만족한다. */
function contrastRatio(hexA,hexB){
  const lin=c=>{ c/=255; return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4); };
  const lum=hex=>{ const h=hex.replace('#',''); const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16); return 0.2126*lin(r)+0.7152*lin(g)+0.0722*lin(b); };
  const L1=lum(hexA), L2=lum(hexB), hi=Math.max(L1,L2), lo=Math.min(L1,L2);
  return (hi+0.05)/(lo+0.05);
}

/* 알림: 서버 푸시 없이도 항상 받을 수 있는 .ics 캘린더 파일(매일 반복 일정)을 만든다. */
function buildIcs(time,summary,dateKey){
  const m=/^(\d{1,2}):(\d{2})$/.exec(time||'20:00');
  let hh=m?Math.min(23,Math.max(0,parseInt(m[1],10))):20, mm=m?Math.min(59,Math.max(0,parseInt(m[2],10))):0;
  let eh=hh, em=mm+10, endDateKey=dateKey||'2026-01-01';
  if(em>=60){ em-=60; eh+=1; }
  if(eh>=24){ eh-=24; endDateKey=addDaysUTC(endDateKey,1); } // 자정을 넘으면 날짜도 하루 밀어서 DTEND가 DTSTART보다 뒤에 오게 한다
  const p2=n=>String(n).padStart(2,'0');
  const dk=(dateKey||'2026-01-01').replace(/-/g,'');
  const edk=endDateKey.replace(/-/g,'');
  const esc=s=>String(s||'').replace(/([,;])/g,'\\$1');
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//paperbite//ko','CALSCALE:GREGORIAN',

/* 계정: 서버 동기화 대신 파일로 내보내고 가져와 합친다. 충돌은 '더 많이 진행된 쪽'을 기준으로
   병합하고, 목록형 데이터(날짜·완료 기록·노트·즐겨찾기 등)는 양쪽을 합쳐 하나도 잃지 않는다. */
function mergeState(a,b){
  a=a||{}; b=b||{};
  const days=[...new Set([...(a.days||[]),...(b.days||[])])].sort();
  const done={};
  for(const dk of new Set([...Object.keys(a.done||{}),...Object.keys(b.done||{})])){
    const da=(a.done||{})[dk]||{}, db=(b.done||{})[dk]||{};
    done[dk]={};
    for(const pid of new Set([...Object.keys(da),...Object.keys(db)])) done[dk][pid]=Object.assign({},da[pid],db[pid]);
  }
  const notes=[...(a.notes||[]),...(b.notes||[])].sort((x,y)=>(y.date||'').localeCompare(x.date||'')).slice(0,120);
  const uniq=key=>[...new Set([...(a[key]||[]),...(b[key]||[])])];
  const history=[...new Map([...(a.history||[]),...(b.history||[])].map(x=>[x.pid,x])).values()];
  const reviewMap=new Map();
  for(const r of [...(a.review||[]),...(b.review||[])]){
    const ex=reviewMap.get(r.id);
    if(!ex||r.box>ex.box||(r.box===ex.box&&r.due>ex.due)) reviewMap.set(r.id,r);
  }
  // 테마·소리·알림 같은 "이 기기" 설정은 건드리지 않는다 — 진행 기록 7개 필드만 합친다
  return {xp:Math.max(Number(a.xp)||0,Number(b.xp)||0),days,done,notes,
    fav:uniq('fav'),later:uniq('later'),history,review:[...reviewMap.values()]};
}

  fav:[],later:[],history:[],day:{k:'',sent:0},review:[],ext:{},
  notifyOn:false,notifyTime:'20:00',notifiedDate:'',measure:false,analytics:[],keyword:''};

/* v1(paperbite.v1) → v2. 기존 기록이 사라지지 않게 한다. */
function migrate(raw){
  if(!raw||typeof raw!=='object') return null;
  if(raw.v===2) return Object.assign({},DEFAULTS,raw);
  const arr=v=>Array.isArray(v)?v:[];
  return Object.assign({},DEFAULTS,{
    v:2,
    xp:Number(raw.xp)||0,
    days:arr(raw.days).filter(x=>typeof x==='string'),
    done:(raw.done&&typeof raw.done==='object')?raw.done:{},
    notes:arr(raw.notes),
    sound:!!raw.sound,
    field:typeof raw.field==='string'?raw.field:'all',
    tags:arr(raw.tags).filter(x=>typeof x==='string'),
    mode:raw.mode==='time'?'time':'read',
    onboarded:!!(Number(raw.xp)||(Array.isArray(raw.days)&&raw.days.length)) // 이미 쓰던 사람에게 온보딩을 다시 보이지 않는다
  });
}

const byId=id=>PAPERS.find(p=>p.id===id)||null;

/* 수집기(collector/collect.mjs + transform.mjs)가 만든 papers.json이 index.html과 같은
   폴더에 있으면 조용히 불러와 섞는다. 같은 출처(동일 출처) 정적 파일만 받으므로
   브라우저가 arXiv 등 외부 API를 직접 호출하지 않는다는 제약을 그대로 지킨다.
   변환(AI 요약·퀴즈)이 아직 안 됐거나(needsTransform) 라이선스상 저장 불가(canPersist:false)한
   항목은 아직 읽을거리가 없으므로 넣지 않는다. 파일이 없으면 그냥 조용히 넘어간다. */
function mergeExternalPapers(list){
  // 화면을 다시 그리지 않는다 — 부트스트랩에서 첫 viewHome() 전에 끝내 호출하므로,
  // "오늘의 논문"이 이미 화면에 뜬 뒤 목록이 바뀌어 다른 논문으로 슬쩍 바뀌는 일이 없다.
  if(!Array.isArray(list)) return;
  const seen=new Set(PAPERS.map(p=>p.id));
  for(const p of list){
    if(!p||!p.id||seen.has(p.id)) continue;
    if(p.needsTransform||p.canPersist===false) continue;
    if(!Array.isArray(p.sents)||!p.sents.length) continue;
    PAPERS.push(p); seen.add(p.id);
  }
}

   STATE (localStorage는 이 브라우저 전용 · 실패해도 동작)
   ===================================================================== */
const KEY='paperbite.v2', KEY_V1='paperbite.v1';
let memCopy=null, migrated=false;
function loadState(){
  let raw=null, fromV1=false;
  try{ raw=localStorage.getItem(KEY); if(!raw){ raw=localStorage.getItem(KEY_V1); fromV1=!!raw; } }catch(e){}
  let s=null;
  if(raw){ try{ s=migrate(JSON.parse(raw)); }catch(e){} }
  if(s&&fromV1) migrated=true; // v1 기록을 바로 v2 키로 옮겨 적는다
  return s||Object.assign({},DEFAULTS,memCopy||{});
}
const S=loadState();
function saveState(){
  const keys=Object.keys(S.done).sort(); while(keys.length>14) delete S.done[keys.shift()];
  S.notes=S.notes.slice(0,60); S.history=S.history.slice(0,60);
  memCopy=JSON.parse(JSON.stringify(S));
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){}
}

const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayKey=()=>ymd(new Date());
function weekDays(){
  const d=new Date(), dow=(d.getDay()+6)%7;
  return Array.from({length:7},(_,i)=>{ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()-dow+i); return {key:ymd(x),label:'월화수목금토일'[i],today:ymd(x)===todayKey()}; });
}
const isDone=(pid,st)=>!!(S.done[todayKey()]&&S.done[todayKey()][pid]&&S.done[todayKey()][pid][st]);
function markDone(pid,st){ const t=todayKey(); S.done[t]=S.done[t]||{}; S.done[t][pid]=S.done[t][pid]||{}; S.done[t][pid][st]=1; saveState(); }
function markDay(){ const t=todayKey(); if(!S.days.includes(t)){ S.days.push(t); S.days=S.days.slice(-400); saveState(); } }
function todaySent(){ return S.day&&S.day.k===todayKey()?S.day.sent:0; }
function bumpSent(){ S.day={k:todayKey(),sent:todaySent()+1}; }
const goalLen=()=>S.goal==='quiz'?5:S.goal;
function toggleList(key,id){
  const list=S[key]||[];
  S[key]=list.includes(id)?list.filter(x=>x!==id):[id,...list];
  saveState();
  return S[key].includes(id);
}

/* 복습 큐 */
function queueReview(pid,qi){
  const id=pid+'#'+qi;
  if(S.review.some(r=>r.id===id)) return; // 이미 큐에 있으면 Leitner 박스를 그대로 둔다
  S.review.push({id,pid,qi,box:1,due:addDaysUTC(todayKey(),1)});
  saveState();
}
function applyReviewOutcome(entryId,correct){
  const idx=S.review.findIndex(r=>r.id===entryId);
  if(idx<0) return;
  const updated=reviewAdvance(S.review[idx],correct,todayKey());
  if(updated) S.review[idx]=updated; else S.review.splice(idx,1); // 졸업하면 큐에서 제거
  saveState();
}
function dueReviewItems(){
  return S.review.filter(r=>r.due<=todayKey())
    .map(r=>({r,paper:byId(r.pid)}))
    .filter(x=>x.paper&&x.paper.quiz&&x.paper.quiz[x.r.qi]);
}

const $=s=>document.querySelector(s);
function h(tag,props,...kids){
  const el=document.createElement(tag);
  if(props) for(const [k,v] of Object.entries(props)){
    if(k==='class') el.className=v;
    else if(k==='on') for(const [ev,fn] of Object.entries(v)) el.addEventListener(ev,fn);
    else if(v===true) el.setAttribute(k,'');
    else if(v!==false&&v!=null) el.setAttribute(k,v);
  }
  for(const kid of kids.flat(Infinity)){ if(kid==null||kid===false) continue; el.append(kid.nodeType?kid:document.createTextNode(String(kid))); }
  return el;
}
let ac=null;
function tone(f,d=.1,type='sine',vol=.05,when=0){
  if(!S.sound) return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const t=ac.currentTime+when, o=ac.createOscillator(), g=ac.createGain();
    o.type=type; o.frequency.value=f; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+.02);
  }catch(e){}
}
const sfx={tick(){tone(620,.07)},ok(){tone(660,.09);tone(880,.1,'sine',.045,.08)},bad(){tone(240,.14,'triangle',.045)},done(){tone(523,.12);tone(784,.14,'sine',.045,.11)}};

}

/* 알림: 서버 푸시 없이 — 기기에 설치해 열어 둔 동안만 동작하는 로컬 알림 + 항상 되는 .ics 대체 */
function maybeNotify(){
  if(!S.notifyOn||!S.notifyTime) return;
  if(typeof Notification==='undefined'||Notification.permission!=='granted') return;
  if(S.notifiedDate===todayKey()) return;
  if(S.days.includes(todayKey())) return; // 오늘 이미 읽었으면 다시 알리지 않는다(죄책감·비난 문구 금지와 같은 취지)
  const [hh,mm]=S.notifyTime.split(':').map(Number);
  const now=new Date();
  if(now.getHours()>hh||(now.getHours()===hh&&now.getMinutes()>=mm)){
    try{ new Notification('논문 한 입',{body:'오늘의 논문 1문장',tag:'paperbite-daily'}); }catch(e){}
    S.notifiedDate=todayKey(); saveState();
  }
}
function downloadBlob(text,filename,type){
  const blob=new Blob([text],{type}); const url=URL.createObjectURL(blob);
  const a=h('a',{href:url,download:filename}); document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}
function downloadIcs(){
  downloadBlob(buildIcs(S.notifyTime,'오늘의 논문 1문장',todayKey()),'paperbite-reminder.ics','text/calendar;charset=utf-8');

}

function importBackup(file){
  const reader=new FileReader();
  reader.onload=()=>{
    let incoming=null;
    try{ incoming=migrate(JSON.parse(reader.result)); }catch(e){}
    if(!incoming){ toast('파일을 읽지 못했어요. 이 앱에서 내려받은 백업 파일인지 확인해 주세요.'); return; }
    Object.assign(S,mergeState(S,incoming)); saveState(); applyPrefs(); renderTop(); viewSettings();
    toast('다른 기기의 기록과 합쳤어요.');
  };
  reader.readAsText(file);
}

function fieldPool(){ return S.field==='all'?PAPERS:PAPERS.filter(p=>p.field===S.field); }
function tagList(){
  const m=new Map();
  fieldPool().forEach(p=>(p.tags||[]).forEach(t=>m.set(t,(m.get(t)||0)+1)));
  return [...m.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ko'));
}
function activeTags(){ const have=new Set(tagList().map(x=>x[0])); return S.tags.filter(t=>have.has(t)); }
function pool(){
  const f=fieldPool(), tg=activeTags();
  let list=tg.length?f.filter(p=>(p.tags||[]).some(t=>tg.includes(t))):f;
  const k=(S.keyword||'').trim().toLowerCase();
  if(k) list=list.filter(p=>(p.title||'').toLowerCase().includes(k)||(p.source||'').toLowerCase().includes(k)||(p.tags||[]).some(t=>t.toLowerCase().includes(k)));
  return list;
}
function pickPaper(){
  const list=pool(); if(!list.length) return null; // 검색어가 너무 좁아 걸리는 논문이 없을 수 있다
  const d=new Date();
  const dayNum=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000);
  return list[(dayNum+home.offset)%list.length];
}

function effectiveSource(paper){

}
function sessionLen(paper){ return Math.min(S.len,effectiveSource(paper).sents.length); }
function buildQuizItem(paper,q,qi){
  const type=q.type||'mc';
  const rng=mulberry32(hash(paper.id+'#'+qi+'#'+todayKey()));
  if(type==='order'){
    const perm=shuffle(q.items.map((_,k)=>k),rng);
    return {type,q:q.q||'문장을 읽은 순서대로 배열하세요.',items:perm.map(k=>q.items[k]),perm,why:q.why||null};
  }
  if(type==='ox') return {type,q:q.statement,options:['O','X'],answer:q.answer?0:1,why:q.why};
  const idx=shuffle([0,1,2].slice(0,q.opts.length),rng);
  return {type,q:q.q,options:idx.map(k=>q.opts[k]),answer:idx.indexOf(0),why:q.why};
}
function newSession(paper,mode,len,diffReq){

       repeat:{read:isDone(paper.id,'read'),quiz:isDone(paper.id,'quiz'),note:isDone(paper.id,'note')}};
  ses.quiz=paper.quiz?paper.quiz.map((q,qi)=>buildQuizItem(paper,q,qi)):(paper.cloze||[]);
  return ses;
}

function copyText(text,okMsg){
  const done=()=>toast(okMsg);
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done,()=>fallback()); return; }
  }catch(e){}
  fallback();
  function fallback(){
    const ta=h('textarea',{style:'position:fixed;left:-9999px;top:0'}); ta.value=text;
    document.body.append(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('복사가 안 돼요.'); }
    ta.remove();
  }
}

    const term=searchBox.value.trim().toLowerCase();

    filtered.forEach(n=>{ const key=n.id||n.title; if(!groups.has(key)){ groups.set(key,{title:n.title,items:[]}); order.push(key); } groups.get(key).items.push(n); });
    notesPanel.replaceChildren(...(order.length?order.map(key=>{ const g=groups.get(key); return h('div',{class:'card',style:'padding:12px'},
        h('div',{class:'label',style:'margin-bottom:6px'},g.title),

        : [h('div',{class:'small muted'},term?'검색 결과가 없어요.':'아직 없어요.')]));
  }

    const term=searchBox.value.trim().toLowerCase();

  mount(

    list('나중에 읽기',S.later||[],'아직 없어요.'),
    list('읽은 논문',hist,'아직 없어요.'),
    h('div',{style:'margin-bottom:18px'},
      h('div',{class:'row between',style:'margin-bottom:6px'},h('div',{class:'label'},`내 노트 (${S.notes.length})`),exportBtn),
      searchBox, notesPanel),
    h('button',{class:'btn',on:{click:goHome}},'홈으로')

/* ---------- 읽기 ---------- */
function startPaper(p){ newSession(p,S.mode); ses.stage='read'; saveResume(); track('read_start',{pid:p.id,len:ses.len,mode:ses.mode}); viewRead(); }
function resumeRead(){
  const r=S.resume, p=r&&byId(r.pid);
  if(!p){ clearResume(); viewHome(); return; }
  newSession(p,r.mode,r.len||S.len,r.diff);
  ses.i=Math.min(r.i||0,ses.len-1); ses.stage='read';
  if(ses.mode==='time'){ ses.mode='read'; } // 이어 읽기는 시간 제한 없이
  viewRead();
}
function viewRead(){
  const p=ses.paper, total=ses.len, i=ses.i;
  const en=ses.lang==='en';
  const hasEn=!en&&!!(p.en&&p.en[i]); // 난이도가 이미 영어면 별도 원문 토글은 필요 없다
  const pips=h('div',{class:'pips',role:'img','aria-label':`${i}/${total}문장 읽음`},
    Array.from({length:total},(_,k)=>h('div',{class:'pip'+(k<i?' done':k===i?' cur':'')})));
  const gloss=h('div',{id:'gloss'});
  const sentEl=h('div',{class:'sent'+(en?' en':''),lang:en?'en':'ko'},
    markTerms(ses.sents[i],en?null:p.terms).map(seg=>seg.term
      ? h('button',{class:'term',type:'button','aria-label':seg.s+' 뜻풀이',on:{click:()=>{
          const cur=gloss.getAttribute('data-t');
          if(cur===seg.s){ gloss.replaceChildren(); gloss.removeAttribute('data-t'); return; }
          gloss.setAttribute('data-t',seg.s);
          gloss.replaceChildren(h('div',{class:'gloss'},h('b',null,seg.s),': '+(seg.def||'뜻풀이가 아직 없어요.')));
        }}},seg.s)
      : seg.s));
  const timerWrap=ses.mode==='time'?h('div',{class:'timer'+(ses.timeLeft<=0?' off':''),id:'timer'},
      h('span',null,'타임어택'),h('span',{class:'track'},h('i',{id:'tbar',style:`width:${Math.max(0,ses.timeLeft/timeLimit(total)*100)}%`})),h('span',{id:'tl'},Math.ceil(ses.timeLeft)+'초')):null;

  mount(
    h('div',{class:'small muted',style:'margin-bottom:8px'},p.title.length>70?p.title.slice(0,68)+'…':p.title),
    pips, timerWrap,
    h('div',{class:'card'},
      h('div',{class:'label',style:'margin-bottom:8px'},`문장 ${i+1} / ${total}`+(ses.repeat.read?' · 복습(점수 없음)':'')),
      sentEl,
      hasEn?h('div',null,h('div',{class:'linkrow'},h('button',{'aria-expanded':String(ses.showEn),on:{click:()=>{ses.showEn=!ses.showEn;viewRead();}}},ses.showEn?'원문 접기':'원문 보기')),
        ses.showEn?h('div',{class:'orig',lang:'en'},p.en[i]):null):null,
      gloss),
    h('button',{class:'btn primary',id:'next',on:{click:onNext}},i<total-1?'다음':'읽기 완료'),
    h('div',{class:'row',style:'margin-top:8px;gap:8px'},
      h('button',{class:'btn sm',disabled:i===0,on:{click:onPrev}},'이전 문장'),
      h('button',{class:'btn sm quiet',on:{click:stopRead}},'그만 읽기')),
    h('div',{class:'small muted',style:'margin-top:10px'},'Space · Enter · → 다음 / ← 이전')
  );
  if(ses.mode==='time'&&i===0&&!ses.t0) ses.t0=performance.now();
  if(ses.mode==='time'&&ses.timeLeft>0){
    const lim=timeLimit(total);
    timers.push(setInterval(()=>{
      const el=Math.max(0,lim-(performance.now()-ses.t0)/1000); ses.timeLeft=el;
      const bar=$('#tbar'), tl=$('#tl'); if(bar) bar.style.width=(el/lim*100)+'%'; if(tl) tl.textContent=Math.ceil(el)+'초';
      if(el<=0){ clearTimers(); ses.mode='read'; const t=$('#timer'); if(t) t.classList.add('off'); if(tl) tl.textContent='시간 종료'; toast('시간이 끝났어요. 받은 점수는 그대로예요.'); }
    },100));
  }
}
function onNext(){
  if(!ses) return;
  sfx.tick();
  if(ses.i===0) track('read_first_sentence',{pid:ses.paper.id});
  if(!ses.repeat.read) award(10);
  bumpSent(); markDay();
  ses.i++;
  if(ses.i>=ses.len){ finishRead(); } else { saveResume(); viewRead(); }
}
function onPrev(){ if(!ses||ses.i===0) return; ses.i--; saveResume(); viewRead(); }
function stopRead(){
  if(!ses) return;
  clearTimers();
  if(ses.i>0) saveResume();
  toast('여기까지 저장했어요. 받은 점수와 기록은 그대로예요.');
  goHome();
}
function finishRead(){
  clearTimers();
  const timed=ses.mode==='time'&&ses.timeLeft>0;
  if(!ses.repeat.read){
    award(lenBonus(ses.len));
    if(timed){ const b=Math.round(ses.timeLeft)*2; if(b>0){ award(b); toast(`남은 시간 보너스 +${b}`); } }
  }
  markDone(ses.paper.id,'read'); markDay(); ses.stages.read=true;
  if(ses.paper.field!=='paste'){ S.history=[{pid:ses.paper.id,date:todayKey()},...(S.history||[]).filter(x=>x.pid!==ses.paper.id)]; }
  clearResume(); saveState();
  track('read_complete',{pid:ses.paper.id,len:ses.len});
  sfx.done(); viewMenu();
}

/* ---------- 퀴즈 ---------- */
const QUIZ_TYPE_LABEL={mc:'퀴즈',ox:'OX 퀴즈',word:'핵심 단어',order:'순서 맞추기'};
function startQuiz(){ ses.qi=0; ses.tries=0; ses.correct=0; ses.combo=0; ses.perfect=true; ses.stage='quiz'; viewQuiz(); }
function viewQuiz(){
  // tries는 여기서 초기화하지 않는다 — order 유형은 오답 후 같은 문제를 다시 그리려고 viewQuiz()를
  // 재호출하는데, 그때 tries를 0으로 되돌리면 재도전이 "첫 시도 정답"으로 잘못 채점된다.
  const Q=ses.quiz[ses.qi], n=ses.quiz.length; ses.answered=false;
  const timed=ses.mode==='time'&&!ses.isReview;
  ses.qLeft=15; ses.qT0=performance.now();
  const body=Q.type==='order'?renderOrderBody(Q):renderChoiceBody(Q);
  mount(
    ses.isReview?h('div',{class:'label'},`복습 ${reviewIdx+1} / ${reviewQueue.length}`)
      :h('div',{class:'pips',role:'img','aria-label':`${ses.qi}/${n}문제 완료`},ses.quiz.map((_,k)=>h('div',{class:'pip'+(k<ses.qi?' done':k===ses.qi?' cur':'')}))),
    timed?h('div',{class:'timer',id:'timer'},h('span',null,'문제당 15초'),h('span',{class:'track'},h('i',{id:'tbar'})),h('span',{id:'tl'},'15초')):null,
    h('div',{class:'card'},
      h('div',{class:'label'},QUIZ_TYPE_LABEL[Q.type]||'퀴즈',ses.isReview?'':` ${ses.qi+1} / ${n}`,(ses.combo>1&&!ses.isReview)?` · ${ses.combo}연속`:''),
      h('div',{class:'h2'},Q.q),
      Q.ctx?h('div',{class:'ctx',lang:'en'},Q.ctx):null,
      body,
      h('div',{id:'fb'})),
    h('div',{class:'small muted',style:'margin-top:10px'},Q.type==='order'?'문장을 맞는 순서대로 눌러 주세요. 틀려도 감점 없이 다시 배열할 수 있어요.':'정답을 맞히면 점수가 들어가요. 틀려도 감점 없이 다시 고를 수 있어요. 1 2 3 키로도 선택.')
  );
  if(timed){
    timers.push(setInterval(()=>{
      const el=Math.max(0,15-(performance.now()-ses.qT0)/1000); ses.qLeft=el;
      const bar=$('#tbar'), tl=$('#tl'); if(bar) bar.style.width=(el/15*100)+'%'; if(tl) tl.textContent=Math.ceil(el)+'초';
      if(el<=0){ onQuizWrong(); renderWrongFeedback(true); }
    },100));
  }
}
function renderChoiceBody(Q){
  return h('div',{id:'opts'},Q.options.map((o,k)=>h('button',{class:'opt','data-i':k,on:{click:()=>choose(k)}},
    h('span',{class:'n'},Q.type==='ox'?(k===0?'O':'X'):String(k+1)),h('span',null,o))));
}
function renderOrderBody(Q){
  let picked=[];
  const list=h('div',{id:'opts'});
  const builtWrap=h('div',{class:'small muted',style:'margin:8px 0 0'});
  function redraw(){
    list.replaceChildren(...Q.items.map((text,pos)=>h('button',{class:'opt',disabled:picked.includes(pos),on:{click:()=>{
      picked.push(pos); redraw();
      if(picked.length===Q.items.length) submitOrder(Q,picked.slice(),()=>{ picked=[]; redraw(); });
    }}},h('span',{class:'n'},picked.includes(pos)?String(picked.indexOf(pos)+1):'·'),text)));
    builtWrap.textContent=picked.length?'선택한 순서: '+picked.map(p=>Q.items[p]).join(' → '):'문장을 순서대로 눌러 주세요.';
  }
  redraw();
  return h('div',null,list,builtWrap);
}
function onQuizWrong(){
  const firstMiss=ses.tries===0;
  ses.tries++; ses.combo=0; ses.perfect=false; sfx.bad(); clearTimers();
  if(firstMiss){
    if(ses.isReview) applyReviewOutcome(ses.reviewEntry.id,false);
    else if(!ses.repeat.quiz) queueReview(ses.paper.id,ses.qi);
    if(!ses.isReview&&!ses.repeat.quiz) track('quiz_answer',{pid:ses.paper.id,type:ses.quiz[ses.qi].type,correct:false,firstTry:true});
  }
}
function onQuizCorrect(){
  ses.answered=true; clearTimers();
  if(ses.isReview){
    if(ses.tries===0) applyReviewOutcome(ses.reviewEntry.id,true);
    award(10); reviewGain+=10;
    return '정답입니다. (복습 +10점)';
  }
  if(ses.tries===0&&!ses.repeat.quiz) track('quiz_answer',{pid:ses.paper.id,type:ses.quiz[ses.qi].type,correct:true,firstTry:true});
  if(ses.tries===0){
    ses.correct++; ses.combo++;
    if(!ses.repeat.quiz) award(20+Math.min(ses.combo-1,3)*5+(ses.mode==='time'?Math.ceil(ses.qLeft/3):0));
    return ses.combo>1?`정답입니다. ${ses.combo}연속.`:'정답입니다.';
  }
  if(!ses.repeat.quiz) award(10);
  return '재도전 정답입니다.'+(ses.repeat.quiz?'':' (+10)');
}
function renderWrongFeedback(timedOut){
  const tl=$('#tl'), t=$('#timer'); if(tl) tl.textContent='재도전은 시간 제한 없음'; if(t) t.classList.add('off');
  $('#fb').replaceChildren(h('div',{class:'why err',role:'alert'},h('b',null,timedOut?'시간 초과예요. 다시 골라 주세요.':'아니에요. 다시 골라 주세요.'),
    h('div',{class:'muted small',style:'margin-top:4px'},'감점은 없어요. 맞히면 점수가 들어갑니다.')));
}
function renderCorrectFeedback(line,Q,last){
  const nextLabel=ses.isReview?(reviewIdx>=reviewQueue.length-1?'복습 마치기':'다음 복습 문제'):(last?'결과 보기':'다음 문제');
  $('#fb').replaceChildren(
    h('div',{class:'why'},h('b',null,line),Q.orig?h('div',{class:'muted small',style:'margin-top:6px',lang:'en'},Q.orig):null,Q.why?h('div',{class:'muted small',style:'margin-top:6px'},Q.why):null),
    h('button',{class:'btn primary',id:'qnext',style:'margin-top:12px',on:{click:nextQ}},nextLabel)
  );
}
function choose(k){
  if(ses.answered) return;
  const Q=ses.quiz[ses.qi];
  if(k!==Q.answer){
    onQuizWrong();
    const b=document.querySelectorAll('.opt')[k]; if(b){ b.disabled=true; b.classList.add('wrong'); }
    renderWrongFeedback(false);
    return;
  }
  document.querySelectorAll('.opt').forEach((b,i)=>{ b.disabled=true; if(i===Q.answer) b.classList.add('correct'); });
  const last=ses.qi>=ses.quiz.length-1;
  const line=onQuizCorrect();
  renderCorrectFeedback(line,Q,last);
}
function submitOrder(Q,pickedPositions,resetPicked){
  if(ses.answered) return;
  const seq=pickedPositions.map(p=>Q.perm[p]);
  const correct=seq.every((v,i)=>v===i);
  if(!correct){
    onQuizWrong(); // tries만 올리고 문제는 그대로 — 전체를 다시 그리면(viewQuiz) 재도전이 "첫 시도"로 잘못 채점된다
    renderWrongFeedback(false);
    resetPicked();
    return;
  }
  const last=ses.qi>=ses.quiz.length-1;
  const line=onQuizCorrect();
  renderCorrectFeedback(line,Q,last);
}
function nextQ(){
  if(!ses.answered) return;
  if(ses.isReview){ reviewIdx++; nextReviewItem(); return; }
  if(ses.qi>=ses.quiz.length-1){
    if(!ses.repeat.quiz&&ses.perfect&&ses.quiz.length>=2){ award(30); toast('모두 첫 시도 정답 +30'); }
    markDone(ses.paper.id,'quiz'); ses.stages.quiz=true; markDay();
    sfx.done(); viewMenu();
  } else { ses.qi++; ses.tries=0; viewQuiz(); }
}

/* ---------- 복습 세션 ---------- */
function startReview(){
  const items=dueReviewItems();
  if(!items.length){ toast('오늘 복습할 문제가 없어요.'); return; }
  reviewQueue=items; reviewIdx=0; reviewGain=0;
  nextReviewItem();
}
function nextReviewItem(){
  if(!reviewQueue||reviewIdx>=reviewQueue.length){ finishReview(); return; }
  const {r,paper}=reviewQueue[reviewIdx];
  const built=buildQuizItem(paper,paper.quiz[r.qi],r.qi);
  clearTimers();
  ses={paper,sents:paper.sents,lang:'ko',mode:'read',quiz:[built],qi:0,i:0,gain:0,stages:{},answered:false,tries:0,combo:0,perfect:true,
       repeat:{read:true,quiz:false,note:true},isReview:true,reviewEntry:r};
  viewQuiz();
}
function finishReview(){
  const gain=reviewGain;
  reviewQueue=null; reviewIdx=0; reviewGain=0; ses=null;
  toast(gain>0?`복습 완료! +${gain}점`:'복습 완료!');
  goHome();
}

/* ---------- 웹에서 실시간 검색 ----------
   OpenAlex는 브라우저에서 직접 CORS로 부를 수 있어(헤더로 확인함) 그대로 호출한다.
   arXiv·OSF는 CORS가 없어 작은 프록시(worker/search-proxy.js, Cloudflare Workers)를 거친다.
   결과는 AI 변환·라이선스 게이트를 거치지 않은 원문 그대로라서 "읽기 시작" 없이
   제목·저자·초록 일부·원문 링크만 보여준다. */
const SEARCH_PROXY_URL='https://cairn.rladlrrua12.workers.dev';
async function searchOpenAlexLive(term,limit){
  const url=`https://api.openalex.org/works?filter=title.search:${encodeURIComponent(term)}&per-page=${limit}`;
  const res=await fetch(url);
  if(!res.ok) throw new Error('OpenAlex '+res.status);
  const j=await res.json();
  return (j.results||[]).map(w=>({
    id:'openalex-'+String(w.id||'').split('/').pop(),
    title:w.display_name||'(제목 없음)',
    authors:(w.authorships||[]).map(a=>a.author&&a.author.display_name).filter(Boolean).join(', ')||null,
    date:w.publication_date?w.publication_date.slice(0,7):(w.publication_year?String(w.publication_year):null),
    url:(w.best_oa_location&&w.best_oa_location.landing_page_url)||(w.primary_location&&w.primary_location.landing_page_url)||w.id,
    abstract:reconstructAbstract(w.abstract_inverted_index),
    source:'OpenAlex',
  }));
}
async function searchProxied(source,term,limit){
  const url=`${SEARCH_PROXY_URL}/search?source=${source}&q=${encodeURIComponent(term)}&limit=${limit}`;
  const res=await fetch(url);
  const j=await res.json().catch(()=>null);
  if(!res.ok||!j||j.error) throw new Error((j&&j.error)||('프록시 '+res.status));
  return j.results||[];
}
function webResultCard(r){
  const readable=splitSentences(r.abstract||'').length>=3;
  return h('div',{class:'card'},
    h('div',{class:'row',style:'gap:6px'},h('span',{class:'badge'},r.source)),
    h('div',{class:'h2'},r.title),
    h('div',{class:'cite'},[r.authors||'저자 미확인',r.date||'연도 미확인'].join(' · ')),
    r.abstract?h('div',{class:'small muted',style:'margin-top:6px'},truncateText(r.abstract,220)):null,
    h('div',{class:'small muted',style:'margin-top:6px'},
      readable?'AI 요약이 아니라 원문 문장을 그대로 잘라 읽어요. 퀴즈는 빈칸 채우기로 자동 생성돼요.'
        :'초록이 없거나 너무 짧아서 바로 읽기는 지원하지 않아요.'),
    h('div',{class:'linkrow'},
      readable?h('button',{on:{click:()=>{
        const paper=buildAlgoPaper({id:'live:'+r.id,source:r.source,title:r.title,authors:r.authors,date:r.date,url:r.url,text:r.abstract});
        if(paper) startPaper(paper);
      }}},'읽기 시작'):null,
      r.url?h('a',{href:r.url,target:'_blank',rel:'noopener noreferrer'},'원문 보기 ↗'):null)
  );
}
function viewWebSearch(){
  renderTop();
  const input=h('input',{type:'search',placeholder:'arXiv·OSF·OpenAlex에서 찾기','aria-label':'웹 논문 검색'});
  const status=h('div',{class:'small muted',style:'margin:8px 0'},'검색어를 입력하고 Enter를 누르세요.');
  const results=h('div');
  async function runSearch(){
    const term=input.value.trim();
    if(!term) return;
    status.textContent='찾는 중…'; results.replaceChildren();
    const jobs=[
      searchOpenAlexLive(term,5).catch(e=>({error:'OpenAlex: '+e.message})),
      searchProxied('arxiv',term,5).catch(e=>({error:'arXiv: '+e.message})),
      searchProxied('osf',term,5).catch(e=>({error:'OSF: '+e.message})),
    ];
    const settled=await Promise.all(jobs);
    const errors=settled.filter(r=>r&&r.error).map(r=>r.error);
    const items=settled.filter(r=>Array.isArray(r)).flat();
    status.textContent=items.length?`${items.length}건 찾았어요.`+(errors.length?` (일부 소스 실패: ${errors.join(', ')})`:'')
      :(errors.length?'전부 실패했어요: '+errors.join(', '):'결과가 없어요.');
    results.replaceChildren(...items.map(webResultCard));
  }
  input.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); runSearch(); } });
  mount(
    h('div',{class:'card'},
      h('div',{class:'label'},'웹에서 논문 찾기'),
      h('div',{class:'h2'},'arXiv·OSF·OpenAlex를 실시간으로 검색해요'),
      h('div',{class:'small muted',style:'margin-bottom:8px'},'라이선스 확인 전 원문이라 저장은 안 돼요. 초록이 충분히 길면 "읽기 시작"으로 원문 문장과 자동 빈칸 퀴즈를 바로 볼 수 있어요(AI 번역·요약은 아니에요).'),
      input, status),
    results,
    h('button',{class:'btn quiet',on:{click:goHome}},'돌아가기')
  );
  input.focus();
}

/* 붙여넣기·웹 검색 결과 공통: AI 없이 알고리즘만으로 "읽을거리"를 만든다.
   요약은 번역·쉬운 말 바꾸기가 아니라 원문 문장을 그대로 잘라 쓰는 것이고(이해가 필요한 작업은
   알고리즘으로 못 한다), 퀴즈는 핵심 단어를 가리는 빈칸 퀴즈(makeCloze)로 자동 생성한다.
   저장하지 않는다(field:'paste'라 history·서재에 남지 않음 — finishRead()의 기존 분기 그대로 탄다). */
function buildAlgoPaper(opts){
  const sents=splitSentences(opts.text);
  if(sents.length<3) return null;
  const use=sents.slice(0,Math.max(S.len,5));
  const id=opts.id||('paste:'+hash(use.join('|')));
  return {
    id, field:'paste', source:opts.source||'직접 붙여넣기',
    title:opts.title||(use[0].length>60?use[0].slice(0,58)+'…':use[0]),
    authors:opts.authors||null, date:opts.date||null, lic:'unk', url:opts.url||null,
    sents:use, terms:[], cloze:makeCloze(use,hash(id)),
  };
}

/* keyboard */
document.addEventListener('keydown',e=>{
  if(!ses||!ses.paper) return;
  const t=e.target; if(t&&(t.tagName==='TEXTAREA'||t.tagName==='INPUT')) return;
  if(t&&t.tagName==='BUTTON') return; // 버튼에 포커스가 있으면 브라우저 기본 동작에 맡김
  if(document.querySelector('#next')){
    if([' ','Enter','ArrowRight'].includes(e.key)){ e.preventDefault(); onNext(); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); onPrev(); }
    return;
  }
  if(document.querySelector('.opt')){
    // 보기 버튼은 유형(mc/ox/word/order)과 상관없이 자기 onclick을 갖고 있으니 그대로 클릭만 흉내 낸다
    if(!ses.answered&&/^[1-9]$/.test(e.key)){ const b=document.querySelectorAll('#opts .opt')[+e.key-1]; if(b&&!b.disabled) b.click(); }
    else if(ses.answered&&(e.key==='Enter'||e.key==='ArrowRight')){ e.preventDefault(); nextQ(); }
  }
});

async function boot(){
  if(migrated) saveState();
  applyPrefs();
  renderTop();
  // 수집기 출력을 첫 viewHome() 전에 반영한다 — 그래야 "오늘의 논문"이 화면에 뜬 뒤
  // 목록이 바뀌어 다른 논문으로 슬쩍 바뀌는 경쟁 상태가 생기지 않는다. 같은 출처 정적
  // 파일이라 보통 즉시 끝나지만, 혹시 느려도 1.5초면 포기하고 내장 샘플로 진행한다.
  try{
    const timeout=new Promise(r=>setTimeout(()=>r(null),1500));
    const res=await Promise.race([fetch('./papers.json').catch(()=>null),timeout]);
    if(res&&res.ok) mergeExternalPapers(await res.json());
  }catch(e){}
  viewHome();
  track('app_open',{});
  maybeNotify();
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') maybeNotify(); });
  window.__pbTest=()=>ses; // test.mjs 전용 훅 — 현재 세션 상태를 읽기만 한다
}
boot();
})();
</script>
</body>
</html>
